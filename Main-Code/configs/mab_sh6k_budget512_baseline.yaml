# 直接 D2L 的 chunk=512 对照配置；当前 checkpoint 原生 rank=8。
# 路径统一相对本 YAML 文件所在目录解析，禁止依赖启动时的工作目录。
# 按实验需求修改本文件；代码不维护另一套默认配置。
schema_version: 2

experiment:
  # 用于标识输出目录和运行记录，不决定算法分支。
  name: mab_sh6k_d2l_direct_chunk512
  seed: 42

model:
  d2l_root: ../../resources/doc-to-lora
  checkpoint_path: ../../resources/checkpoints/qwen_4b_d2l/checkpoint-20000/pytorch_model.bin
  base_model_path: ../../resources/models/Qwen3-4B-Instruct-2507
  chat_template_path: ../../resources/doc-to-lora/chat_templates/Qwen/Qwen3-4B-Instruct-2507.jinja
  # cuda 使用当前可见设备；进程外可通过 CUDA_VISIBLE_DEVICES 选择物理 GPU。
  device: cuda
  # 只约束基座加载精度；生成因子的精度按原生 checkpoint 契约核查。
  dtype: bfloat16
  # 选定后不因依赖缺失自动切换到另一注意力实现。
  attention_implementation: eager

memory:
  # 每个 chunk 直接生成 checkpoint 原生 rank 的 LoRA；当前 checkpoint 为 rank=8。
  # 上限包含 D2L 模板与特殊 token；历史因子持续追加，不设置槽位或淘汰预算。
  chunk_tokens: 512

generation:
  task:
    max_input_tokens: 4096
    max_new_tokens: 512
    do_sample: false
    # 采样参数在 do_sample=true 时参与解码；不继承模型目录中的生成预设。
    temperature: 1.0
    top_p: 1.0
    top_k: 50
    repetition_penalty: 1.0
    num_beams: 1
    # 只控制单次生成的缓存，顶层调用之间仍不保留 KV。
    use_cache: true
    cache_implementation: null
prompts:
  task_path: ../prompts/task.md

data:
  # revision、Parquet 文件、source_filter 和原生指标均读取现有 manifest。
  manifest_path: ../../resources/data/mab/first_eval.json
  selection: first_evaluation
  official_scorer_path: ../../research/benchmark_sources/mab_code/utils/eval_other_utils.py
  # 来自 MAB FactConsolidation 的更新规则，用于任务提示；D2L 只编译原始 context。
  # 不包含具体问题、答案或答案相关 metadata；规则展示时机作为本项目协议记录。
  protocol_instruction: |
    Facts are prefixed with serial numbers. When facts conflict, the fact
    with the larger serial number is newer. Use the supplied knowledge
    pool rather than real-world knowledge when interpreting these facts.

output:
  # 每次运行在此目录下创建独立子目录，禁止覆盖已有运行产物。
  directory: ../../research/runs

logging:
  # 与结果目录分开；每次运行写入 logs/<run_id>/，路径相对本 YAML。
  directory: ../logs
  level: INFO
